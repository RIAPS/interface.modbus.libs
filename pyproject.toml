[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]


[project]
name = "riaps-interfaces-modbus"
version = "0.1.0"
authors = [
  { name="RIAPS"},
]
description = "A riaps interface library for modbus"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Linux",
]
dependencies = [
    "modbus_tk",
    # All three are imported by src/riaps/interfaces/modbus/ but were never
    # declared, so this package only ever installed successfully next to
    # something else that happened to pull them in. On a clean environment
    # `import riaps.interfaces.modbus.ModbusInterface` raised ModuleNotFoundError.
    "pyyaml",    # config.py, ModbusInterface.py, ModbusDeviceComponent.py, slave.py
    "pyserial",  # ModbusInterface.py (RTU transport)
    "pyzmq",     # ModbusMasterThread.py
]

[project.optional-dependencies]
dev = [
    "watchdog",
    "pytest"
]

[project.urls]
"Homepage" = "https://github.com/RIAPS/interface.modbus.libs"
"Bug Tracker" = "https://github.com/RIAPS/interface.modbus.libs/issues"